phase: 6
name: Kubernetes bootstrap
status: proposed

objective: >-
  Bootstrap the Talos Kubernetes control plane and workers from the already-approved
  Phase 5 machine configurations without installing Cilium or crossing into Phase 7.

approval_required: true

sources_of_truth:
  - AGENTS.md
  - .ai/project-policy.md
  - docs/stage-1-goal-and-phase-tracker.md
  - versions.env

read_scope:
  - infrastructure/talos/
  - infrastructure/libvirt/
  - scripts/
  - tests/
  - Makefile

preconditions:
  - main or the active phase branch reflects completed Phase 5 state
  - host and libvirt state have been revalidated locally
  - lab-net is active and matches the approved addressing
  - all three Talos VMs exist with the approved resources and are stopped before execution
  - final per-node Talos configs exist locally and pass strict validation
  - sufficient host disk and memory headroom has been rechecked
  - Talos boot media source, version, checksum, and attachment method have been reviewed

allowed_changes:
  - add Phase 6 scripts, tests, runbook, and Make targets
  - add verified Talos boot-media acquisition/checksum logic
  - add temporary boot-media attachment/detachment logic for the existing Talos VMs
  - boot the existing Talos VMs after explicit phase approval
  - apply the approved machine configs to the three nodes
  - bootstrap etcd exactly once on talos-cp01
  - retrieve and configure talosconfig and kubeconfig as ignored local artifacts
  - validate Talos services, etcd, and Kubernetes API state

forbidden_changes:
  - install or configure Cilium
  - enable kube-proxy
  - change CNI from none
  - change any pinned version without a separate compatibility review and explicit approval
  - modify the host firewall, physical NIC, default route, partitions, bootloader, desktop, unrelated Docker/VPN configuration, or unrelated development tooling
  - delete or recreate existing VM disks or libvirt networks
  - expose lab services publicly
  - begin Phase 7 work

consequential_actions:
  - attach verified Talos boot media to existing VMs
  - boot the three Talos VMs
  - apply the approved Talos machine configs
  - bootstrap etcd once on talos-cp01
  - detach boot media and verify disk boot after installation

validation:
  preflight:
    - make validate
    - make phase-preflight PHASE=6
  acceptance:
    - all three Talos nodes are installed and boot from their existing virtual disks
    - Talos control-plane services report healthy enough to serve the Kubernetes API
    - etcd is bootstrapped exactly once and reports healthy
    - kubectl can reach the Kubernetes API using the retrieved kubeconfig
    - CNI remains none
    - kube-proxy remains disabled
    - no Cilium resources are installed
    - no host safety-boundary changes occurred

expected_transitional_state:
  - Kubernetes nodes may remain NotReady until Phase 7 installs Cilium
  - network-dependent cluster workloads may remain Pending or unready until Phase 7

rollback_boundary:
  - stop and report on unexpected state rather than resetting Talos, restoring etcd, deleting VM disks, or recreating the network
  - destructive rollback requires separate explicit confirmation

ai_budget:
  implementation_model: terra
  implementation_effort: medium
  routine_fix_model: terra
  routine_fix_effort: low
  escalation: >-
    Use Sol medium only for concrete Talos/bootstrap/distributed-system failures that
    Terra cannot resolve with a narrowly scoped follow-up. Astra is not the default.

stop_condition: >-
  Stop after Phase 6 implementation, validation, documentation, and report. Do not
  install Cilium or prepare Phase 7 implementation in the same execution.
